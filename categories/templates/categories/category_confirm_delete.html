{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Delete Category</h1>
    <a class="button secondary" href="{% url 'category_list' %}">Back to Categories</a>
</div>

<form class="panel form-grid" method="post">
    {% csrf_token %}
    <p>Delete <strong>{{ category.name }}</strong>? Books inside this category will also be deleted.</p>
    <div class="actions">
        <button class="button danger" type="submit">Delete</button>
        <a class="button secondary" href="{% url 'category_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
