{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
    <a class="button secondary" href="{% url 'category_list' %}">Back to Categories</a>
</div>

<form class="panel form-grid" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
        <div class="form-row">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}

    <div class="actions">
        <button class="button" type="submit">{{ submit_label }}</button>
        <a class="button secondary" href="{% url 'category_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
