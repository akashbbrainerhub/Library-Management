{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
    <a class="button secondary" href="{% url 'book_list' %}">Back to Books</a>
</div>

<form class="panel form-grid" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
        <div class="{% if field.name == 'is_available' %}checkbox-row{% else %}form-row{% endif %}">
            {% if field.name == 'is_available' %}
                {{ field }}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {% else %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            {% endif %}
            {{ field.errors }}
        </div>
    {% endfor %}

    <div class="actions">
        <button class="button" type="submit">{{ submit_label }}</button>
        <a class="button secondary" href="{% url 'book_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
